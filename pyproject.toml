[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-tracker"
version = "1.0.0"
description = "A lightweight command-line expense tracker application in Python standard library."
readme = "README.md"
requires-python = ">=3.8"

[project.scripts]
expense-tracker = "expense_tracker:main"

